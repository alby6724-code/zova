{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    - host: admin.forantigravity.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-server
                port:
                  number: {{ .Values.service.serverPort }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-server
                port:
                  number: {{ .Values.service.serverPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-client
                port:
                  number: {{ .Values.service.clientPort }}
{{- end }}
