services:
  postgres:
    image: postgres:16-alpine
    container_name: forantigravity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forantigravity
      POSTGRES_USER: olx_admin
      POSTGRES_PASSWORD: super_secure_password_2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olx_admin -d forantigravity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forantigravity-net

  redis:
    image: redis:7-alpine
    container_name: forantigravity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forantigravity-net

  server:
    build:
      context: ./server
      dockerfile: ../infra/docker/Dockerfile.server
    container_name: forantigravity-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: forantigravity-enterprise-jwt-super-secret-key-2026
      JWT_REFRESH_SECRET: forantigravity-refresh-secret-rotation-key-2026
      INITIAL_ADMIN_PASSWORD_HASH: ${INITIAL_ADMIN_PASSWORD_HASH:-$2a$12$ir/QFybd9NmBlEyeQyLR.epXAho/oWwQ6NIdWUzCoqg/OlVguMtQm}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      DATABASE_URL: postgresql://olx_admin:super_secure_password_2026!@postgres:5432/forantigravity
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forantigravity-net

  client:
    build:
      context: ./client
      dockerfile: ../infra/docker/Dockerfile.client
    container_name: forantigravity-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - forantigravity-net

volumes:
  pgdata:

networks:
  forantigravity-net:
    driver: bridge
